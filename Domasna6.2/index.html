<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/Domasna6.2/style.css">
</head>
<body>
  <div class="card">

  <div class="weather">

    <!-- TOP -->
    <div class="top">
      <div class="city">
        <i class="bi bi-geo-alt-fill"></i>
        <span>London</span>
      </div>

      <h2>Wednesday - Nov 11</h2>
      <h1>22:45 PM</h1>
    </div>

    <!-- MIDDLE -->
    <div class="middle">
      <img class="main-weather" src="/Domasna6/thunder.png" />

      <div class="current-day">
        <span>23°C</span>
        <p>Thunder</p>
      </div>
    </div>

    <!-- INFO -->
    <div class="weather-info">
      <p>Feels like: 7°</p>
      <p>Wind: N 5mph</p>
      <div>
        <span>Sunrise: 05:45AM</span>
        <span>Sunset: 06:25PM</span>
      </div>
    </div>

    <hr />

    <!-- WEEK -->
    <div class="this-week">
      <div class="day">
        <p>WED</p>
        <img src="/Domasna6/rainy.png">
        <p>28° / 23°</p>
      </div>
      <div class="day">
        <p>THU</p>
        <img src="/Domasna6/cloudy.png">
        <p>32° / 28°</p>
      </div>
      <div class="day">
        <p>FRI</p>
        <img src="/Domasna6/sunny.png">
        <p>34° / 29°</p>
      </div>
      <div class="day">
        <p>SAT</p>
        <img src="/Domasna6/cloudy.png">
        <p>25° / 15°</p>
      </div>
      <div class="day">
        <p>SUN</p>
        <img src="/Domasna6/sunny.png">
        <p>35° / 29°</p>
      </div>
    </div>

  </div>

  <!-- SIDE ICONS -->
  <div class="icons">
    <div><i class="bi bi-cloud-sun-fill"></i><p>Weather</p></div>
    <div><i class="bi bi-bell"></i><p>Alert</p></div>
    <div><i class="bi bi-clock"></i><p>Time</p></div>
    <div><i class="bi bi-geo-fill"></i><p>City</p></div>
  </div>

</div>
</body>
</html>
